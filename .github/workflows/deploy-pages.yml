name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /portfolio-site

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export GIT_INDEX_FILE="$(mktemp)"
          git --work-tree=out add -A
          tree="$(git write-tree)"
          parent="$(git rev-parse --verify origin/gh-pages 2>/dev/null || true)"

          if [ -n "$parent" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "Deploy static site")"
          else
            commit="$(git commit-tree "$tree" -m "Deploy static site")"
          fi

          git push origin "$commit:refs/heads/gh-pages"
